<main class="min-h-screen bg-slate-50 px-4 py-8 sm:px-6 lg:px-10">
  <div class="mx-auto max-w-3xl">
    <a
      [routerLink]="backLink"
      class="mb-4 inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 transition-colors hover:text-slate-700"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
      Zurück zur Übersicht
    </a>

    <div class="mb-6">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">{{ title }}</h1>
      <p class="mt-1 text-sm text-slate-500">{{ subtitle }}</p>
    </div>

    <form (ngSubmit)="submit()" #deviceForm="ngForm" class="rounded-lg border border-slate-200 bg-white shadow-sm">
      <div class="space-y-8 px-6 py-6">
        <section>
          <h2 class="mb-4 text-xs font-semibold uppercase tracking-wide text-slate-500">Allgemein</h2>
          <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label for="id" class="mb-1.5 block text-sm font-medium text-slate-700">Id</label>
              <input
                id="id"
                type="text"
                readonly
                [value]="deviceId ?? 'Wird automatisch vergeben'"
                class="w-full cursor-not-allowed rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-sm text-slate-500 shadow-sm"
              />
            </div>

            <div class="sm:col-span-2">
              <label for="name" class="mb-1.5 block text-sm font-medium text-slate-700">Bezeichnung</label>
              <input
                id="name"
                type="text"
                name="name"
                [(ngModel)]="device.name"
                required
                placeholder="z. B. Akkuschrauber Bosch GSR 18V"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
              />
            </div>

            <div>
              <label for="category" class="mb-1.5 block text-sm font-medium text-slate-700">Gattung</label>
              <select
                id="category"
                name="category"
                [(ngModel)]="device.category"
                required
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
              >
                <option value="" disabled>Bitte wählen…</option>
                @for (category of categories; track category) {
                  <option [value]="category">{{ category }}</option>
                }
              </select>
            </div>

            <div>
              <label for="createdAt" class="mb-1.5 block text-sm font-medium text-slate-700">Erstelldatum</label>
              <input
                id="createdAt"
                type="date"
                name="createdAt"
                [(ngModel)]="device.createdAt"
                required
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
              />
            </div>

            <div class="sm:col-span-2">
              <label for="serialNumber" class="mb-1.5 block text-sm font-medium text-slate-700">Seriennummer</label>
              <input
                id="serialNumber"
                type="text"
                name="serialNumber"
                [(ngModel)]="device.serialNumber"
                placeholder="z. B. SN-2026-00123"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 font-mono text-sm text-slate-900 shadow-sm placeholder:font-sans placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
              />
            </div>
          </div>
        </section>

        <section>
          <h2 class="mb-4 text-xs font-semibold uppercase tracking-wide text-slate-500">Weitere Angaben</h2>
          <div class="space-y-5">
            <div>
              <label for="details" class="mb-1.5 block text-sm font-medium text-slate-700">Details</label>
              <textarea
                id="details"
                name="details"
                [(ngModel)]="device.details"
                required
                rows="3"
                placeholder="Technische Angaben, Zubehör, Zustand…"
                class="w-full resize-none rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
              ></textarea>
            </div>

            <div>
              <label for="remarks" class="mb-1.5 block text-sm font-medium text-slate-700">Bemerkung</label>
              <textarea
                id="remarks"
                name="remarks"
                [(ngModel)]="device.remarks"
                rows="2"
                placeholder="Optionale Notiz, z. B. zu Wartung oder Standort…"
                class="w-full resize-none rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
              ></textarea>
            </div>
          </div>
        </section>
      </div>

      <div class="flex items-center justify-end gap-3 rounded-b-lg border-t border-slate-200 bg-slate-50 px-6 py-4">
        <a
          [routerLink]="backLink"
          class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition-colors hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-50"
        >
          Abbrechen
        </a>
        <button
          type="submit"
          [disabled]="deviceForm.invalid"
          class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75 9 17.25l10.5-10.5" />
          </svg>
          {{ submitLabel }}
        </button>
      </div>
    </form>
  </div>
</main>
